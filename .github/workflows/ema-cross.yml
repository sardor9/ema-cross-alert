name: EMA Cross Alert

on:
  schedule:
    - cron: "5 13 * * 1-5"    # 18:05 Toshkent (UTC+5)
    - cron: "35 14 * * 1-5"   # 19:35 — zaxira (GitHub kechiktirsa)
    - cron: "5 16 * * 1-5"    # 21:05 — zaxira
  workflow_dispatch:           # qo'lda ishga tushirish tugmasi

concurrency:
  group: ema-cross
  cancel-in-progress: false

permissions:
  contents: write              # ema_state.json ni saqlash uchun

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: EMA cross tekshiruvi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python ema_cross_alert.py --once
      - name: Holatni saqlash
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add ema_state.json || true
          git add ticker_meta.json || true
          git add docs/data.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

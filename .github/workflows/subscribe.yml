name: Telegram obunachilar

on:
  schedule:
    - cron: "*/10 * * * *"     # har ~10 daqiqada botga kelgan /start larni tekshiradi
  workflow_dispatch:

concurrency:
  group: ema-sub
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Obunachilarni yangilash
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python ema_cross_alert.py --subscribe
      - name: Saqlash
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add subscribers.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update subscribers"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
